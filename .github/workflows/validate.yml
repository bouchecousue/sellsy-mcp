name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --frozen --all-groups --python '${{ matrix.python }}'
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
      - run: uv build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --frozen --all-groups --python 3.13
      - run: uvx bandit==1.9.4 -q -r src
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/sellsy-mcp-runtime.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/sellsy-mcp-runtime.txt
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == name { print $1 "  gitleaks.tar.gz" }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf gitleaks.tar.gz gitleaks
          "$RUNNER_TEMP/gitleaks" git "$GITHUB_WORKSPACE" --redact --no-banner

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t sellsy-mcp-community:test .
      - name: Check isolated container startup
        run: |
          docker run -d --name mcp-test -p 127.0.0.1:18766:8766 \
            -e SELLSY_CLIENT_ID=00000000-0000-4000-8000-000000000001 \
            -e SELLSY_CLIENT_SECRET=synthetic-ci-value \
            sellsy-mcp-community:test
          trap 'docker logs mcp-test; docker rm -f mcp-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18766/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
